name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Validate source and tests
        run: |
          python -m py_compile world_console.py
          python -m unittest discover -s tests -v
          python scripts/check-market-freshness.py
          python scripts/check-package-resources.py --source-only --max-market-age-days 7
          npm run check

  responsive-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install browser test runtime
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run responsive UI checks
        shell: bash
        run: |
          export CODEX_WORLD_DATA_DIR="$RUNNER_TEMP/codex-world-data"
          python world_console.py --no-browser --port 8797 >"$RUNNER_TEMP/world-console.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8797/api/config >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8797/api/config >/dev/null
          npm run test:responsive

  windows-package:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python x64
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install pinned PyInstaller
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.22.2"

      - name: Install verified Inno Setup 7 x64
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP "innosetup-7.0.2-x64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "Inno Setup 7"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe" -OutFile $download
          $expected = "5AD54CA3DEF786F8F4212552E54CC6D8D61329E2D24A1CFEE0571D42C2684FF1"
          $actual = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -ne $expected) { throw "Inno Setup SHA-256 mismatch: $actual" }
          $process = Start-Process -FilePath $download -ArgumentList "/CURRENTUSER", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$installDir`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          $compiler = Join-Path $installDir "ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw "ISCC.exe was not installed" }
          "INNO_SETUP_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and inspect Windows package
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath app-manifest.json -Raw | ConvertFrom-Json
          $output = Join-Path $env:RUNNER_TEMP "CodexWorld-package"
          ./scripts/build-windows.ps1 -Version ([string]$manifest.version) -OutputDir $output -ExpectedPyInstallerVersion "6.22.2"
          python scripts/check-package-resources.py --app-dir "build/world-installer/dist/Codex World" --expected-version ([string]$manifest.version) --max-market-age-days 7
          if ($LASTEXITCODE -ne 0) { throw "Packaged resource verification failed" }
          $info = (Get-Item -LiteralPath "build/world-installer/dist/Codex World/Codex World.exe").VersionInfo
          if ([string]$info.ProductVersion -notmatch "^$([regex]::Escape([string]$manifest.version))(?:\.0)?$") {
            throw "Unexpected app ProductVersion: $($info.ProductVersion)"
          }
